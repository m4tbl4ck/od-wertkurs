<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Beratungstools" name="DIN 77230 Finanzanalyse" subtitle="43 Themen, fortlaufend, Punkt-Platzhalter, Umschalter" -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wertkurs — DIN 77230 Finanzanalyse</title>
<link rel="stylesheet" href="https://use.typekit.net/pdd3dqx.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../kits/colors_and_type.css">
<link rel="stylesheet" href="../kits/beratungstools.css">
<style>
  html, body { margin: 0; background: var(--color-background-subtle); }
  .page { padding: var(--space-7) var(--space-5) var(--space-9); }
</style>
</head>
<body>
<div class="page">
  <div class="din-tool" id="dinTool">

    <!-- toolbar: legends only -->
    <div class="din-toolbar">
      <div class="din-dots-legend" aria-hidden="true">
        <span>Beispielhafte Darstellung. Anzahl und Reihenfolge der Themen variiert, je nach Lebenssituation.</span>
      </div>
      <div class="din-legend" aria-hidden="true">
        <span class="lab-risk">Lücke</span>
        <span class="bar"></span>
        <span class="lab-ok">abgesichert</span>
      </div>
    </div>

    <!-- card -->
    <div class="din-card">
      <div class="din-head">
        <div>
          <p class="eyebrow">Basis-Finanzanalyse · DIN 77230</p>
          <h2>Finanzanalyse</h2>
        </div>
        <div class="wordmark">
          <span class="text-style-logo">wertkurs</span>
          <span class="meta">bis zu 43 Finanzthemen · Prioritätenliste nach Risiko &amp; Eintrittswahrscheinlichkeit</span>
        </div>
      </div>

      <div class="din-colhead">
        <span class="h-rank">Nr.</span>
        <span class="h-topic">Betrifft</span>
        <span class="h-luecke">Lücke</span>
        <span class="h-score">Score</span>
      </div>

      <div id="dinStages"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   DIN 77230 — Basis-Finanzanalyse, 43 Finanzthemen, fortlaufend
   nummeriert über 3 Bedarfsstufen (1–23 / 24–41 / 42–43).

   Each item is either a real theme or a placeholder:
     theme:        { n, name, grundschutz?, luecke, score, skw? }
                   score: 0–100 (Absicherungsgrad), or null = "nicht bewertet"
                   luecke: "keine" | text | {main, sub}
     placeholder:  { n, ph: true, skw? }
                   a "variable theme" (Reihenfolge/Inhalt je Lebenssituation)
                   → shown as a row of dots in BOTH modes.

   Real anchors come from the Finanzportal24 analysis; gaps are filled
   with placeholders because the concrete order varies per household.
   Edit freely to fit a real case.
   ============================================================ */
const DIN_DATA = [
  {
    stufe: "1", kicker: "Bedarfsstufe 1",
    name: "Sicherung des finanziellen Grundbedarfs",
    count: "23 Finanzthemen",
    themes: [
      { n: "1",  name: "Kostenrisiko Krankheit", grundschutz: true, luecke: "keine", score: 100, skw: "56%" },
      { n: "2",  name: "Allgemeines Haftungsrisiko", luecke: "keine", score: 100, skw: "50%" },
      { n: "3",  ph: true, skw: "44%" },
      { n: "4",  ph: true, skw: "52%" },
      { n: "5",  ph: true, skw: "40%" },
      { n: "6",  ph: true, skw: "48%" },
      { n: "7",  ph: true, skw: "46%" },
      { n: "8a", name: "Arbeitskraftverlust Erwerbsunfähigkeit", grundschutz: true, luecke: "914 € mtl.", score: 50, skw: "72%" },
      { n: "8b", name: "Arbeitskraftverlust Berufs-/Dienstunfähigkeit", grundschutz: true, luecke: "914 € mtl.", score: 50, skw: "82%" },
      { n: "8c", name: "Arbeitskraftverlust Arbeitsunfähigkeit", grundschutz: true, luecke: "39 € mtl.", score: 98, skw: "70%" },
      { n: "9",  name: "Aufbau Liquiditätsreserve", luecke: "keine", score: 100, skw: "46%" },
      { n: "10", name: "Altersvorsorge", grundschutz: true, luecke: "2.741 € mtl.", score: 43, skw: "38%" },
      { n: "11", name: "Kostenrisiko Pflegebedürftigkeit", grundschutz: true, luecke: "3.065 € mtl.", score: 0, skw: "56%" },
      { n: "12", name: "Kostenrisiko Krankheit aus stationären Zusatzleistungen", luecke: { main: "Zusatzleistungen", sub: "stationärer Bereich" }, score: 0, skw: "84%" },
      { n: "13", name: "Risiko von nicht gedeckten Folgekosten nach Unfall und Krankheit", luecke: "20.000 €", score: 0, skw: "86%" },
      { n: "14", name: "Kostenrisiko aus Rechtsdurchsetzung", luecke: { main: "300.000 € / Bereich", sub: "Privat · Beruf · Wohnen · Verkehr" }, score: 0, skw: "64%" },
      { n: "15", ph: true, skw: "50%" },
      { n: "16", ph: true, skw: "42%" },
      { n: "17", ph: true, skw: "54%" },
      { n: "18", ph: true, skw: "46%" },
      { n: "19", ph: true, skw: "40%" },
      { n: "20", ph: true, skw: "52%" },
      { n: "21", ph: true, skw: "44%" },
      { n: "22", ph: true, skw: "48%" },
      { n: "23", name: "Kostenrisiko Krankheit im Ausland", luecke: "Absicherung", score: 0, skw: "60%" }
    ]
  },
  {
    stufe: "2", kicker: "Bedarfsstufe 2",
    name: "Erhaltung des Lebensstandards",
    count: "18 Finanzthemen",
    themes: [
      { n: "24", name: "Absicherung der Hinterbliebenen", luecke: "180.000 €", score: 60, skw: "56%" },
      { n: "25", name: "Erhalt von Wohneigentum", luecke: "keine", score: 100, skw: "48%" },
      { n: "26", ph: true, skw: "50%" },
      { n: "27", name: "Schadenrisiko Hausrat", luecke: "8.500 €", score: 65, skw: "44%" },
      { n: "28", ph: true, skw: "46%" },
      { n: "29", name: "Kostenrisiko Mobilität", luecke: "keine", score: 100, skw: "42%" },
      { n: "30", ph: true, skw: "52%" },
      { n: "31", name: "Erweiterte Altersvorsorge", luecke: "520 € mtl.", score: 47, skw: "54%" },
      { n: "32", ph: true, skw: "44%" },
      { n: "33", name: "Erweiterte Pflegeabsicherung", luecke: "1.200 € mtl.", score: 30, skw: "58%" },
      { n: "34", ph: true, skw: "48%" },
      { n: "35", name: "Krankenzusatz Zahnersatz", luecke: "65 € mtl.", score: 40, skw: "50%" },
      { n: "36", ph: true, skw: "42%" },
      { n: "37", ph: true, skw: "54%" },
      { n: "38", ph: true, skw: "46%" },
      { n: "39", ph: true, skw: "50%" },
      { n: "40", ph: true, skw: "44%" },
      { n: "41", ph: true, skw: "52%" }
    ]
  },
  {
    stufe: "3", kicker: "Bedarfsstufe 3",
    name: "Verbesserung des Lebensstandards",
    count: "2 Finanzthemen",
    themes: [
      { n: "42", name: "Schaffung von Eigenkapital für den Erwerb von selbstgenutztem Wohneigentum", luecke: "—", score: null, skw: "92%" },
      { n: "43", name: "Individuelle Ziele", luecke: "—", score: null, skw: "34%" }
    ]
  }
];

(function () {
  const root = document.getElementById("dinTool");
  const stagesEl = document.getElementById("dinStages");

  function lueckeHTML(l) {
    if (l == null) return '<div class="din-luecke"></div>';
    if (typeof l === "object") {
      return `<div class="din-luecke gap">${l.main}<span class="sub">${l.sub}</span></div>`;
    }
    const none = /^keine$/i.test(String(l).trim());
    const dash = String(l).trim() === "—";
    const cls = none ? "none" : (dash ? "" : "gap");
    return `<div class="din-luecke ${cls}">${l}</div>`;
  }

  function scoreHTML(score) {
    if (score == null) {
      return `<div class="din-score"><span class="din-score-val na">–</span><div class="din-bar"></div></div>`;
    }
    return `<div class="din-score">
        <span class="din-score-val">${score} %</span>
        <div class="din-bar"><div class="din-bar-fill" style="--val:${score}%"></div></div>
      </div>`;
  }

  function rowHTML(t) {
    const skw = t.skw ? `--skw:${t.skw};` : "";
    if (t.ph) {
      return `
      <div class="din-row din-placeholder" style="${skw}">
        <span class="din-rank">${t.n}</span>
        <div class="din-topic"><span class="din-dots" aria-hidden="true"></span></div>
        <div class="din-luecke"></div>
        <div class="din-score"><div class="din-bar"></div></div>
      </div>`;
    }
    const lkw = t.lkw ? `--lkw:${t.lkw};` : "";
    const tag = t.grundschutz
      ? `<span class="din-tagrow"><span class="din-tag">Grundschutz</span><i data-lucide="info" class="din-info" title="Grundschutz nach DIN 77230"></i></span>`
      : "";
    return `
      <div class="din-row" style="${skw}${lkw}">
        <span class="din-rank">${t.n}</span>
        <div class="din-topic"><span class="din-name">${t.name}</span>${tag}</div>
        ${lueckeHTML(t.luecke)}
        ${scoreHTML(t.score)}
      </div>`;
  }

  function stageHTML(s) {
    const note = s.note ? `<span class="din-stage-note">${s.note}</span>` : "";
    return `
      <section class="din-stage">
        <div class="din-stage-head">
          <span class="din-stage-num">${s.stufe}</span>
          <div class="din-stage-title">
            <span class="kicker">${s.kicker}</span>
            <span class="name">${s.name}</span>
          </div>
          <span class="din-stage-count">${s.count}</span>
        </div>
        ${s.themes.map(rowHTML).join("")}
      </section>`;
  }

  stagesEl.innerHTML = DIN_DATA.map(stageHTML).join("");
  lucide.createIcons();   // upgrade <i data-lucide> placeholders to inline SVG
})();
</script>
</body>
</html>
