<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Beratungstools" name="Ruhestandsdisplay" subtitle="Kapitalfluss heute→Lebensende, gestapeltes Balkendiagramm" -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wertkurs — Ruhestandsdisplay</title>
<link rel="stylesheet" href="https://use.typekit.net/pdd3dqx.css">
<link rel="stylesheet" href="../kits/colors_and_type.css">
<link rel="stylesheet" href="../kits/ruhestandsdisplay.css">
<style>
  html, body { margin: 0; background: var(--color-background-subtle); }
  .page { padding: var(--space-7) var(--space-5) var(--space-9); }
</style>
</head>
<body>
<div class="page">
  <div class="rhd" id="rhd">

    <div class="rhd-card">
      <div class="rhd-head">
        <div>
          <p class="eyebrow">Ruhestandsplanung · Kapitalfluss</p>
          <h2>Ruhestandsdisplay</h2>
        </div>
        <div class="wordmark">
          <span class="text-style-logo">wertkurs</span>
        </div>
      </div>

      <div class="rhd-legend" aria-hidden="false">
        <span class="rhd-legend-item"><span class="rhd-legend-swatch red"></span>Kapitalbedarf</span>
        <span class="rhd-legend-item"><span class="rhd-legend-swatch green"></span>Vorhandenes Wertkapital</span>
        <span class="rhd-legend-item"><span class="rhd-legend-swatch yellow"></span>Bedarfsminderung</span>
      </div>

      <div class="rhd-chart" id="rhdChart" role="img"
           aria-label="Gestapeltes Balkendiagramm des Kapitalverlaufs: roter Kapitalbedarf und grünes Wertkapital wachsen bis zum Ruhestandsbeginn, dort kommt die gelbe Bedarfsminderung hinzu und nimmt in der Ruhestandsphase wieder ab."></div>

      <div class="rhd-axis" id="rhdAxis"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Ruhestandsdisplay — data is GENERATED to match the typical shape.
   One bar per life-year. Three layers (units; the retirement bar = 100):
     green  — vorhandenes Wertkapital
     red    — Kapitalbedarf
     yellow — Bedarfsminderung
   Accumulation (today → retirement): red & green grow exponentially,
   yellow = 0. At retirement: green+red+yellow = 100 (focal thick bar).
   Retirement → life's end: all layers decay back toward 0.

   Tunables below — no concrete figures are shown anywhere.
   ============================================================ */
const RHD = {
  yearsToRetire: 29,   // Ansparphase length (bars before the retirement bar)
  yearsInRetire: 32,   // Ruhestandsphase length (bars after it)
  // composition at the retirement bar (sums to 100):
  greenAtRetire: 11,   // vorhandenes Wertkapital
  redAtRetire:   64,   // Kapitalbedarf
  yellowAtRetire:25,   // Bedarfsminderung
  growthExp: 2.25      // >1 → exponential ramp-up during accumulation
};

(function () {
  const chart = document.getElementById("rhdChart");
  const axis  = document.getElementById("rhdAxis");
  const root  = document.getElementById("rhd");

  const R = RHD.yearsToRetire;
  const A = RHD.yearsInRetire;
  const N = R + 1 + A;                  // total bars (incl. retirement bar)
  const retireIndex = R;                // 0-based index of the thick bar

  const bars = [];
  for (let i = 0; i < N; i++) {
    let green = 0, red = 0, yellow = 0;
    if (i < retireIndex) {
      // accumulation: exponential ramp 0 → retirement values
      const t = i / retireIndex;                 // 0..~1
      const ramp = Math.pow(t, RHD.growthExp);
      green = RHD.greenAtRetire * ramp;
      red   = RHD.redAtRetire   * ramp;
      yellow = 0;
    } else if (i === retireIndex) {
      green = RHD.greenAtRetire;
      red   = RHD.redAtRetire;
      yellow = RHD.yellowAtRetire;
    } else {
      // retirement: decay back to ~0 toward the end of the Ruhestandsphase
      const s = (i - retireIndex) / A;           // 0..1
      const decay = Math.pow(1 - s, 1.35);
      const greenNat = RHD.greenAtRetire  * decay * (1 - 0.55 * s); // natural green
      const redNat   = RHD.redAtRetire    * decay * (1 - 0.30 * s); // natural red
      yellow = RHD.yellowAtRetire * decay * (1 + 0.10 * s);
      // Vorhandenes Wertkapital (grün) wird über die ersten 5 Ruhestandsbalken
      // GLEICHMÄSSIG bis auf 0 verbraucht; die wegfallende grüne Differenz wird
      // von Rot aufgefangen, sodass die Oberkante (grün+rot+gelb) unverändert bleibt.
      const greenBars = (i - retireIndex);       // 1,2,3,… in die Ruhestandsphase
      const f = Math.max(0, (5 - greenBars) / 5);// 0.8, 0.6, 0.4, 0.2, 0 → dann 0
      green = greenNat * f;
      red   = redNat + greenNat * (1 - f);
    }
    bars.push({ i, green, red, yellow, retire: i === retireIndex });
  }

  // render bars (green at bottom, then red, then yellow on top)
  chart.innerHTML = bars.map(b => {
    const seg = (cls, v) => v > 0.4 ? `<div class="rhd-seg ${cls}" style="--v:${v}%"></div>` : "";
    const delay = Math.round((b.i / N) * 520);
    return `<div class="rhd-bar ${b.retire ? "is-retire" : ""}" style="--d:${delay}ms">
        ${seg("green", b.green)}
        ${seg("red", b.red)}
        ${seg("yellow", b.yellow)}
      </div>`;
  }).join("");

  // ---- phase markers, positioned to the real bar centres ----
  const phases = [
    { key: "start",  cls: "at-start", lab: "Heute" },
    { key: "anspar", lab: "Ansparphase" },
    { key: "retire", cls: "is-retire", lab: "Ruhestandsbeginn" },
    { key: "ruhe",   lab: "Ruhestandsphase" }
  ];
  axis.innerHTML = phases.map(p =>
    `<div class="rhd-phase ${p.cls || ""}" data-key="${p.key}">
       <span class="tick"></span><span class="lab">${p.lab}</span>
     </div>`).join("");

  function centerX(barEl) {
    const cr = chart.getBoundingClientRect();
    const br = barEl.getBoundingClientRect();
    return (br.left + br.width / 2) - cr.left;
  }
  function position() {
    const barEls = chart.querySelectorAll(".rhd-bar");
    if (!barEls.length) return;
    const cr = chart.getBoundingClientRect();
    const accumMid = Math.floor(retireIndex / 2);
    const ruheMid  = retireIndex + 1 + Math.floor(A / 2);
    const place = (key, x) => {
      const el = axis.querySelector(`.rhd-phase[data-key="${key}"]`);
      if (el) el.style.left = x + "px";
    };
    place("start",  0);
    place("anspar", centerX(barEls[accumMid]));
    place("retire", centerX(barEls[retireIndex]));
    place("ruhe",   centerX(barEls[Math.min(ruheMid, N - 1)]));
  }

  function start() {
    position();
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(start);
    setTimeout(start, 1400);
  } else { start(); }
  let raf;
  window.addEventListener("resize", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(position); });
})();
</script>
</body>
</html>
